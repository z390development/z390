name: Publish docs via GitHub Pages
on:
  push:
    # Run for main and for doc/**. Deploy is decided on the deploy job below.
    branches:
      - main
      - "doc/**"

permissions:
  contents: read

concurrency:
  # Upstream main shares one group. Every other run uses its own, so a doc build does not wait on a production deploy.
  group: "${{ (github.repository == 'z390development/z390' && github.ref == 'refs/heads/main') && 'pages' || format('pages-{0}', github.ref) }}"
  cancel-in-progress: false

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 21

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: version
        run: echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT
        id: version
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - uses: actions/setup-java@v3
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - run: pip install -r doc/requirements.txt
      - run: bash/bldjavadoc doc/javadoc
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build site
        run: mkdocs build
        env:
          Z390_VERSION: ${{ steps.version.outputs.version }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy docs
    # Official site: upstream main only. A fork deploys its own Pages site for main and for doc/**.
    if: >-
      (github.repository == 'z390development/z390' && github.ref == 'refs/heads/main')
      || github.event.repository.fork
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
