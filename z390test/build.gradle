plugins {
    id 'groovy'
}

group = 'org.z390.test'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.26'
    implementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def requestedMode = (findProperty('testMode') ?: 'standard').toString()
def testMode
if (requestedMode.equals('full')) {
    testMode = 'full'
} else if (requestedMode.equals('standard')) {
    testMode = 'standard'
} else {
    throw new GradleException("testMode must be 'standard' or 'full', was '${requestedMode}'")
}

test {
    useJUnitPlatform()
    systemProperty 'z390.test.mode', testMode
    inputs.property('z390.test.mode', testMode)
    testLogging.showStandardStreams = true
}
